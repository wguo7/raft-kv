# 5-node cluster. Each node keeps its WAL on its own named volume, so a
# killed container restarts from disk.
x-node: &node
  build: .
  image: raft-kv:latest
  restart: "no"

services:
  node1:
    <<: *node
    command: ["-id", "1", "-cluster", "1=node1:7000:8080,2=node2:7000:8080,3=node3:7000:8080,4=node4:7000:8080,5=node5:7000:8080", "-data", "/data"]
    ports: ["8081:8080"]
    volumes: ["data1:/data"]
  node2:
    <<: *node
    command: ["-id", "2", "-cluster", "1=node1:7000:8080,2=node2:7000:8080,3=node3:7000:8080,4=node4:7000:8080,5=node5:7000:8080", "-data", "/data"]
    ports: ["8082:8080"]
    volumes: ["data2:/data"]
  node3:
    <<: *node
    command: ["-id", "3", "-cluster", "1=node1:7000:8080,2=node2:7000:8080,3=node3:7000:8080,4=node4:7000:8080,5=node5:7000:8080", "-data", "/data"]
    ports: ["8083:8080"]
    volumes: ["data3:/data"]
  node4:
    <<: *node
    command: ["-id", "4", "-cluster", "1=node1:7000:8080,2=node2:7000:8080,3=node3:7000:8080,4=node4:7000:8080,5=node5:7000:8080", "-data", "/data"]
    ports: ["8084:8080"]
    volumes: ["data4:/data"]
  node5:
    <<: *node
    command: ["-id", "5", "-cluster", "1=node1:7000:8080,2=node2:7000:8080,3=node3:7000:8080,4=node4:7000:8080,5=node5:7000:8080", "-data", "/data"]
    ports: ["8085:8080"]
    volumes: ["data5:/data"]

  # Load generator inside the cluster network: docker compose run --rm bench
  bench:
    image: raft-kv:latest
    profiles: ["bench"]
    entrypoint: ["kvbench", "-nodes", "node1:8080,node2:8080,node3:8080,node4:8080,node5:8080"]

volumes: {data1: {}, data2: {}, data3: {}, data4: {}, data5: {}}
